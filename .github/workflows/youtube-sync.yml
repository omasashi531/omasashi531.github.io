# YouTubeに公開されたLOGの動画と、受信報告（コメント）の数を、サイトに自動で入れる
# ・1時間に1回、自動で動く（公開リポジトリなので、GitHub Actions の利用は無料）
# ・Actions →「YouTubeの動画をサイトに入れる」→ Run workflow で、すぐ動かすこともできる
name: YouTubeの動画をサイトに入れる

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: YouTubeの新着を見て、data/logs.js と data/reports.js（受信報告の数）を更新
        env:
          # Google Cloud で作ったAPIキー（Settings → Secrets → Actions に「YOUTUBE_API_KEY」で登録）
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node .github/scripts/youtube-sync.mjs

      - name: 変わっていたら保存して、サイトを更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logs.js data/reports.js data/world.js
          git commit -m "YouTubeから自動で更新（LOG・受信報告の数・世界観の記録）"
          git push
          # 自動で保存した変更でも、サイトの公開をやり直すように頼む
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "公開のやり直しを頼めませんでした（次の更新で反映されます）"
